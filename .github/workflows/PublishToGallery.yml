name: Publish to PowerShell Gallery

on:
  push:
    branches:
      - Master

jobs:
  PublishToGallery:
    runs-on: windows-latest

    # Only when run from the main repo
    if: github.repository == 'Microsoft365DSC/Microsoft365DSC'

    steps:
      - uses: actions/checkout@v6
      - name: Install Dependencies
        shell: powershell
        run: |
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.SecurityProtocolType]::Tls12
          $manifest = Import-PowerShellDataFile "./Modules/Microsoft365DSC/Microsoft365DSC.psd1"
          $dependencies = $manifest.RequiredModules
          foreach ($dependency in $dependencies)
          {
              Write-Verbose -Message "Installing Module {$($dependency.ModuleName)} Version {$($dependency.RequiredVersion)}"
              Install-Module $dependency.ModuleName -RequiredVersion $dependency.RequiredVersion -Force -SkipPublisherCheck -AllowClobber -Scope AllUsers -Verbose
              try
              {
                  Import-Module $dependency.ModuleName -Force
              }
              catch
              {
                  Write-Verbose -Message $_
              }
          }
      - name: Build Class Modules
        shell: pwsh
        run: |
          & ./Utilities/Build-Microsoft365DSC.ps1 -SkipSchemaCache
      - name: Build Dll Files
        shell: pwsh
        run: |
          & ./Utilities/Build-DllFiles.ps1 -Configuration Release
      - name: Trim Build-Only Sources
        shell: pwsh
        run: |
          & ./Utilities/Remove-M365DSCBuildOnlySource.ps1 -Confirm:$false
      - name: Bundle DSC Engine and Generate Schema Cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = Import-PowerShellDataFile ./Utilities/DscEngineVersion.psd1
          $clone = Join-Path $env:RUNNER_TEMP 'dsc-engine'
          git clone --depth 1 --branch "v$($pin.RequiredVersion)" $pin.Repository $clone
          if ($LASTEXITCODE -ne 0) { throw "Could not clone $($pin.Repository) at tag v$($pin.RequiredVersion)." }
          # The engine folder already contains its compatibility module under Compat.
          $target = "./Modules/Microsoft365DSC/Dependencies/$($pin.ModuleName)/$($pin.RequiredVersion)"
          $null = New-Item -ItemType Directory -Force -Path $target
          Copy-Item -Path (Join-Path $clone "$($pin.ModuleName)/*") -Destination $target -Recurse -Force
          Copy-Item -Path (Join-Path $clone 'LICENSE') -Destination $target -ErrorAction Ignore
          & ./Utilities/New-M365DSCDscSchemaCache.ps1
      - name: Publish
        shell: powershell
        env:
          PUBLIC_NUGETAPIKEY: ${{ secrets.NugetAPIKey }}
        run: |
          Publish-Module -Path "./Modules/Microsoft365DSC/" -NugetAPIKey $env:PUBLIC_NUGETAPIKEY
