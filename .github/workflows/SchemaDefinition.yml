name: Update M365DSC Schema Definition

on:
  pull_request:
    branches: [ develop ]
    types: [ closed ]  # Only when PR is closed
  workflow_dispatch:   # Still allow manual trigger

jobs:
  update-schema:
    #if: github.repository == 'microsoft/Microsoft365DSC' && github.event.pull_request.merged == true
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import Module and Generate Schema Definition
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module .\Modules\Microsoft365DSC\Modules\M365DSCSchemaHandler.psm1
          New-M365DSCSchemaDefinition

      - name: Check for changes
        id: git-check
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ((git status --porcelain).Count -eq 0) {
            echo "no_changes=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "no_changes=false" >> $env:GITHUB_OUTPUT
          }

      - name: Commit and push changes
        if: steps.git-check.outputs.no_changes == 'false'
        id: commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          $branch = "update/schema-definition-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
          git checkout -b $branch
          git add Modules/Microsoft365DSC/SchemaDefinition.json
          git commit -m "Update SchemaDefinition.json"
          git push origin $branch
          echo "branch=$branch" >> $env:GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.no_changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh pr create `
            --title "Update SchemaDefinition.json" `
            --body "Automated update of SchemaDefinition.json using New-M365DSCSchemaDefinition." `
            --base Dev `
            --head ${{ steps.commit.outputs.branch }}
